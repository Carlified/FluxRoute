; FluxRoute pipeline configuration
; Editable values for wave-pipelining. Changes take effect on restart.

[FlipFlop]
; Pin-name prefixes treated as a clock input (case-insensitive).
ClockPinPrefixes=clk,clock
; A flip-flop has between MinInputs and MaxInputs input pins
; and exactly Outputs output pins.
MinInputs=2
MaxInputs=2
Outputs=1
